name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 云端编译 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 允许 gradlew 执行
        run: chmod +x ./gradlew

      - name: 编译 Debug + Release APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: 收集 APK
        run: |
          mkdir -p apk-out
          find app/build/outputs/apk -name "*.apk" -exec cp {} apk-out/ \;
          ls -lh apk-out/

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: GequbaoApp-APK
          path: apk-out/*.apk
          retention-days: 30

      # 打 tag（v1.0 这种）时发正式 Release
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/*.apk
          generate_release_notes: true

      # main 分支每次推送都刷新 rolling latest Release，方便直接下载最新 APK
      - name: 更新 latest Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建（latest）
          prerelease: true
          files: apk-out/*.apk
          body: |
            由 GitHub Actions 在 `${{ github.sha }}` 上自动构建。

            - `app-debug.apk` / `app-release.apk` —— 都是 debug 签名，可直接安装
